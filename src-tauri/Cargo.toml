[package]
name = "ttaeng"
version = "0.3.1"
description = "땡해줘 - 부팅 후 언제부터 PC를 써도 되는지 보여주는 도구"
authors = ["lsft32"]
edition = "2024"

[lib]
name = "ttaeng_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target."cfg(windows)".dependencies]
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
