<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>땡해줘</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="details.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>땡해줘</h1>
      <span class="muted">부팅 후 언제부터 PC를 써도 되는지</span>
      <span id="ver" class="ver muted"></span>
    </div>
    <div class="actions">
      <label class="toggle" id="autoWrap">
        <input type="checkbox" id="auto" />
        <span>로그인 시 자동 실행</span>
        <span id="autoMethod" class="muted"></span>
      </label>
      <span id="updNote" class="muted" hidden></span>
      <button id="updCheck">업데이트 확인</button>
      <button id="demo" class="primary">지금 측정해 보기</button>
    </div>
  </header>

  <main>
    <section id="upd" class="upd" hidden>
      <div class="updText">
        <b id="updTitle"></b>
        <span id="updSub" class="muted"></span>
      </div>
      <button id="updInstall" class="primary" hidden>설치</button>
    </section>

    <section id="empty" class="card" hidden>
      <h2>아직 부팅 기록이 없습니다</h2>
      <p class="muted">다음에 PC를 켜고 로그인하면 자동으로 측정합니다. 지금 화면과 판정이 어떻게 동작하는지는 "지금 측정해 보기"로 확인할 수 있습니다.</p>
    </section>

    <section id="current" hidden>
      <div class="titleRow">
        <h2 id="recTitle"></h2>
        <span id="recWhen" class="muted"></span>
      </div>
      <div id="cards" class="cards"></div>

      <div class="card">
        <div class="cardHead">
          <h3>타임라인</h3>
          <span id="legend" class="legend"></span>
        </div>
        <div id="timeline"></div>
      </div>

      <div class="card" id="probeCard" hidden>
        <div class="cardHead">
          <h3>체감 반응 <span class="tip" title="측정 중 2초마다 타이머 지연·작은 계산·4KB 디스크 쓰기 시간을 재서, 측정 직후 잰 평소 값과 비교했습니다. 타이머·디스크 중 더 크게 느려진 배율(5표본 중앙값)을 그렸습니다. 계산 시간은 하이브리드 CPU에서 코어 종류에 따라 흔들려 참고로만 보여줍니다. 1.5배 이하가 10초 이어지기 시작한 때를 '반응 회복'으로 봅니다.">i</span></h3>
          <span id="probeLegend" class="legend"></span>
        </div>
        <div id="probeChart"></div>
      </div>

      <div class="card">
        <h3>평가와 추천</h3>
        <div id="advice"></div>
      </div>
    </section>

    <section class="card">
      <h3>부팅 이력 <span class="tip" title="행을 누르면 위에 그 회차를 표시합니다. 데모 측정은 이력에 저장하지 않습니다.">i</span></h3>
      <table id="history">
        <thead>
          <tr><th>일시</th><th>종류</th><th>사용 가능</th><th>등급</th><th>병목</th><th>항목</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="common.js"></script>
  <script src="details.js"></script>
</body>
</html>
